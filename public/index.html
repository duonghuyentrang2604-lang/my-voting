<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talent Show | Bình chọn</title>
<style>
:root{--bg:#06152f;--card:#0d2450;--line:#1d3b74;--text:#eef3ff;--mut:#9db2dc;--acc:#ffc233;--accT:#1a1200}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 110px}
.step{font-size:12px;letter-spacing:.12em;color:var(--acc);font-weight:700}
h1{font-size:22px;margin:6px 0 4px}
p.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
input{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.err{color:#ff8a8a;margin-top:10px;min-height:20px;font-size:14px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);color:inherit;border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font:inherit;cursor:pointer}
.item[aria-pressed="true"]{border-color:var(--acc)}
.item .n{flex:1}.item b{display:block}.item small{color:var(--mut)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:transparent}
.item[aria-pressed="true"] .chk{background:var(--acc);border-color:var(--acc);color:var(--accT)}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
footer div{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
footer span{flex:1;font-size:13px;color:var(--mut)}
button.btn{background:var(--acc);color:var(--accT);border:0;border-radius:12px;padding:13px 22px;font:inherit;font-weight:700;cursor:pointer}
button.btn:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.done{text-align:center;padding-top:40px}.done .big{font-size:54px}
</style>
</head>
<body>
<main id="app">Đang tải...</main>
<footer id="foot"><div><span id="info"></span><button class="btn ghost" id="back">Quay lại</button><button class="btn" id="next">Tiếp tục</button></div></footer>
<script>
var TEAMS=[],KIDS=[],step=0,uid="",pick1=[],pick2=null;
var app=document.getElementById("app"),info=document.getElementById("info"),
    next=document.getElementById("next"),back=document.getElementById("back"),foot=document.getElementById("foot");
fetch("/api/config").then(function(r){return r.json()}).then(function(c){TEAMS=c.teams;KIDS=c.kids;render()});

function nm(l,id){for(var i=0;i<l.length;i++)if(l[i].id===id)return l[i].name;return""}
function list(items,sel,multi){
  return items.map(function(x){
    var on=multi?sel.indexOf(x.id)>-1:sel===x.id;
    return '<button class="item" data-id="'+x.id+'" aria-pressed="'+on+'"><div class="n"><b>'+x.name+'</b><small>'+x.sub+'</small></div><div class="chk">✓</div></button>';
  }).join("");
}
function render(){
  foot.style.display=step===3?"none":"";
  back.style.display=step===2?"":"none";
  if(step===0){
    app.innerHTML='<div class="step">BÌNH CHỌN</div><h1>Đăng nhập bằng User ID</h1><p class="sub">Nhập đúng mã User đã được cung cấp.</p><input id="uid" placeholder="User ID" autocomplete="off" value="'+uid+'"><div class="err" id="err"></div>';
    var el=document.getElementById("uid");
    el.oninput=function(){next.disabled=!el.value.trim()};
    info.textContent="";next.textContent="Tiếp tục";next.disabled=!uid;
  }else if(step===1){
    app.innerHTML='<div class="step">BƯỚC 1/2 · GIẢI TẬP THỂ</div><h1>Chọn tối đa 3 tiết mục bạn yêu thích</h1><p class="sub">Chạm lại vào lựa chọn để bỏ chọn trước khi gửi.</p>'+list(TEAMS,pick1,true);
    info.innerHTML='Đã chọn <b>'+pick1.length+'/3</b>';next.textContent="Tiếp theo";next.disabled=!pick1.length;
  }else if(step===2){
    app.innerHTML='<div class="step">BƯỚC 2/2 · GIẢI CÁ NHÂN</div><h1>Chọn 1 tài năng nhí xuất sắc nhất</h1><p class="sub">Mỗi User ID chỉ được bình chọn một lần.</p>'+list(KIDS,pick2,false);
    info.textContent=pick2?nm(KIDS,pick2):"Chưa chọn";next.textContent="Gửi bình chọn";next.disabled=!pick2;
  }else{
    app.innerHTML='<div class="done"><div class="big">🎉</div><h1>Cảm ơn bạn đã bình chọn!</h1><p class="sub">Phiếu của bạn đã được ghi nhận.</p></div>';
  }
}
app.addEventListener("click",function(e){
  var b=e.target.closest(".item");if(!b)return;var id=b.getAttribute("data-id");
  if(step===1){var i=pick1.indexOf(id);if(i>-1)pick1.splice(i,1);else if(pick1.length<3)pick1.push(id)}
  else if(step===2){pick2=pick2===id?null:id}
  render();
});
next.onclick=async function(){
  if(step===0){
    uid=document.getElementById("uid").value.trim();next.disabled=true;
    try{
      var r=await fetch("/api/vote?uid="+encodeURIComponent(uid));var d=await r.json();
      if(r.ok){step=1;render()}else{document.getElementById("err").textContent=d.error;next.disabled=false}
    }catch(e){document.getElementById("err").textContent="Lỗi mạng, thử lại.";next.disabled=false}
    return;
  }
  if(step===1){step=2;render();window.scrollTo(0,0);return}
  next.disabled=true;
  try{
    var r2=await fetch("/api/vote",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({uid:uid,teams:pick1,kid:pick2})});
    var d2=await r2.json();
    if(r2.ok){step=3;render()}else{alert(d2.error||"Có lỗi xảy ra");next.disabled=false}
  }catch(e){alert("Lỗi mạng, thử lại.");next.disabled=false}
};
back.onclick=function(){step=1;render()};
</script>
</body>
</html>
